name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR branch).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Note on the Python matrix: the pixi umbrella pins the interpreter in
# pixi.toml / pixi.lock (python 3.13.*), so every job runs the single locked
# environment rather than a per-version matrix. A true multi-version matrix
# would require separate pixi environments per Python; that is deferred (the
# `pixi run ci` local gate remains authoritative).
#
# Note on the OS matrix (Story 20.6): the quality/build/coverage jobs below all
# run on `ubuntu-latest` (the merge gate). One additional job — `unit-windows`
# — runs the backend unit suite on `windows-latest` against the
# `win-64` pixi environment (Story 20.2, gunicorn-free) so cross-platform
# regressions (POSIX `/tmp` paths, the Unix-only Celery prefork pool, gunicorn
# imports) are caught in CI rather than by a developer on Windows. It is a lean,
# offline guard (eager Celery + SQLite via `config.settings.test`); no broker,
# worker, or gunicorn runs on Windows.

jobs:
  # --- Backend quality: ruff lint, ruff format check, mypy, bandit ---
  backend-quality:
    name: Backend Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest
      - name: Ruff lint
        run: pixi run lint
      - name: Ruff format check
        run: pixi run fmt-check
      - name: mypy
        run: pixi run check
      - name: bandit security scan
        run: pixi run security

  # --- Backend tests + branch coverage -> Codecov (flag: backend) ---
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: backend-quality
    steps:
      - uses: actions/checkout@v4
      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest
      - name: Run tests with coverage
        run: pixi run cov-xml
      - name: Upload backend coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: backend
          name: backend
          fail_ci_if_error: false

  # --- Backend package build (wheel) ---
  backend-build:
    name: Backend Build
    runs-on: ubuntu-latest
    needs: backend-quality
    steps:
      - uses: actions/checkout@v4
      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest
      - name: Build wheel
        run: pixi run build

  # --- Docker image build validation (no push) ---
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: backend-quality
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # --- SonarCloud static analysis (Story 9.2) ---
  # Regenerates both coverage reports in-job (via the 9.1 pixi tasks) and scans
  # with SonarCloud. No-ops gracefully when SONAR_TOKEN is absent, and is skipped
  # for pull requests from forks (which cannot access the secret).
  sonar:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: backend-test
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for new-code detection and blame data
      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest
      # Detect the token without interpolating the secret into the shell.
      - name: Check for SONAR_TOKEN
        id: sonar_token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SONAR_TOKEN not set — skipping SonarCloud analysis."
          fi
      - name: Generate backend coverage (coverage.xml)
        if: steps.sonar_token.outputs.present == 'true'
        run: pixi run cov-xml
      - name: SonarCloud Scan
        if: steps.sonar_token.outputs.present == 'true'
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # --- Windows cross-platform guard (Story 20.6, widened by Story 22.3) ---
  #
  # NOT advisory. Docker and Podman are unavailable on Windows under the destination
  # organization's security policy, so the containerless path is the ONLY local path for part
  # of the team — a regression there stops their work outright, with no workaround.
  #
  # This job earned its keep on PR #197: it failed with
  #     UnicodeDecodeError: 'charmap' codec can't decode byte 0x8f
  # while the entire Ubuntu gate passed. A bare `read_text` uses locale.getencoding() — UTF-8
  # on macOS/Linux, cp1252 on Windows — and 25 call sites depended on that difference. Nothing
  # else in CI could have caught it.
  #
  # Runs the FULL suite (`cov` = unit + integration under the same >=90% floor) rather than
  # `test`, so the parts most likely to break here are actually exercised: the filesystem
  # broker's locking, the --pool=solo worker override (prefork is Unix-only), the Beat schedule
  # file, SQLite paths, and the wheel build inside test_wheel_layout. `test` + `test-integration`
  # are deliberately NOT listed alongside `cov` — that would run everything three times.
  #
  # Deliberately skipped here, and why (AC #4):
  #   lint / fmt-check / precommit / docs-build / security — text analysis with pinned tool
  #     versions and no platform-dependent behaviour; running them twice adds minutes and no
  #     information.
  #   build — covered indirectly: tests/integration/test_wheel_layout.py builds a real wheel.
  #   check (mypy) — same sources, same pinned config; a platform-specific typing problem would
  #     surface in the tests this job now runs.
  #
  # Expect this to be the slowest job (the unit suite alone was ~6m40s). That is the cost of
  # the guarantee.
  #
  # ⚠ Renaming this job DETACHES any branch-protection required-status-check entry, because
  # GitHub matches required checks by NAME. Protection then passes because the named check
  # never reports — worse than having none. Update the branch-protection entry in the same
  # change if you rename it.
  suite-windows:
    name: Windows Full Suite
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest
      - name: Run the full suite with the coverage gate
        run: pixi run cov
