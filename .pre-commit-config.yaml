# Vendored tooling and generated planning artifacts are not ours to reformat.
exclude: '^(_bmad/|_bmad-output/|\.claude/|\.agents/)'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # The vendored third-party releases (Story 21.3) must stay byte-identical to
      # upstream so they can be verified against the published artifact — see
      # src/django_service/static/VENDOR.md. Appending a newline or trimming whitespace
      # would silently break that. Our own app.css / theme.js / icons.svg are NOT
      # excluded; only the files we did not author.
      - id: trailing-whitespace
        exclude: &vendored ^src/django_service/static/(css/bootstrap\.min\.css|js/(bootstrap\.bundle|htmx)\.min\.js)$
      - id: end-of-file-fixer
        exclude: *vendored
      - id: check-yaml
        # mkdocs.yml uses a pymdownx python-name YAML tag (mermaid custom_fence)
        # that the default safe loader cannot construct, so it is excluded here.
        # MkDocs validates it at build time (`mkdocs build --strict`, ci
        # docs-build step). All other YAML stays strict safe_load.
        exclude: ^mkdocs\.yml$
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: debug-statements
      - id: mixed-line-ending
        exclude: *vendored
  - repo: https://github.com/millsks/conventional-commit-hook
    rev: v0.1.1
    hooks:
      - id: conventional-commit-hook
        stages: [commit-msg]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.0
    hooks:
      - id: ruff
        args: [--fix]
        files: ^(src|tests)/|^manage\.py$
      - id: ruff-format
        files: ^(src|tests)/|^manage\.py$
# mypy is not run here: the isolated pre-commit env cannot resolve Django + the
# django-stubs plugin + our package. Type checking runs in the full pixi env via
# `pixi run check` (ci step 3).
