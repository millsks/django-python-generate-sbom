  # Epic 20 — Unified Cross-Platform Local Development (containerless). Local dev runs on BOTH macOS
  # (osx-arm64) and Windows (win-64) with NO containers (enterprise policy blocks Docker/Podman on Windows),
  # SQLite + local filesystem storage (already the base.py defaults), and a real separate Celery worker on a
  # container-free transport — everything driven by pixi tasks. OCP/prod (Epic 19) stays containerized with
  # enterprise PostgreSQL/Redis/S3. Fixed decisions: keep Celery, swap local to a Kombu filesystem:// broker +
  # a django-celery-results DB result backend (SQLite) with a REAL worker (Windows uses --pool=solo/threads;
  # prefork is Unix-only); eager (CELERY_TASK_ALWAYS_EAGER) reserved for tests; runserver + honcho + a Procfile
  # so `pixi run dev` launches web+worker+beat (gunicorn is Unix-only -> containers/OCP only); RETIRE the
  # dependency-graph visualization entirely (removes the fragile pygraphviz/graphviz win-64 deps) while
