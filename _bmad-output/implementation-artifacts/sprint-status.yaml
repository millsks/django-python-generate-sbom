  # are far smaller than macOS/Linux, which is why only Windows hit it. Confirmed by raising
  # the worker to --loglevel=DEBUG and reproducing the IDENTICAL hang on macOS (216s vs the
  # usual 12s). Stories 22.15 (missing HTTP timeouts) was a real defect found on the way and
