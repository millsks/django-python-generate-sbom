# Codecov configuration (Story 9.1).
#
# One upload stream: the Django/DRF/Celery backend (pytest -> coverage.xml). The
# `backend` flag and component are kept rather than folded into the default so the
# history from before Story 21.19 retired the React SPA stays continuous.
codecov:
  require_ci_to_pass: true

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
      backend:
        target: auto
        threshold: 1%
        flags:
          - backend
    patch:
      default:
        target: auto

# The flag scopes the upload to the source tree.
flag_management:
  default_rules:
    carryforward: true
  individual_flags:
    - name: backend
      paths:
        - src

# The component gives it a named view in the Codecov UI.
component_management:
  individual_components:
    - component_id: backend
      name: Backend (Django/DRF/Celery)
      paths:
        - src/**

comment:
  layout: "header, diff, flags, components"
  behavior: default
