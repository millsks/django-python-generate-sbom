# 01_django — Django web application (REST API + async tasks)
# Minor-version pins keep the solver flexible; run `conda env export --no-builds` for a lockfile.
name: django-app
channels:
  - conda-forge
dependencies:
  - python=3.13
  - django=6.1
  - djangorestframework=3.18
  - django-filter=26.1
  - django-cors-headers=4.9
  - django-environ=0.14
  - django-storages=1.14
  - psycopg=3.3
  - celery=5.6
  - redis-py=8.1
  - whitenoise=6.12
  - gunicorn=26.1
  - pillow=12.3
  - python-dotenv=1.2
  - pip
  - pip:
      - drf-spectacular==0.30.0
      - dj-database-url==3.1.2
      - django-redis==7.0.0
      - sentry-sdk==2.68.0
