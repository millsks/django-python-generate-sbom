# 02_flask — Flask web application (server-rendered + forms + ORM)
name: flask-app
channels:
  - conda-forge
dependencies:
  - python=3.13
  - flask=3.1
  - werkzeug=3.1
  - jinja2=3.1
  - itsdangerous=2.2
  - click=8.4
  - flask-sqlalchemy=3.1
  - sqlalchemy=2.0
  - flask-migrate=4.1
  - alembic=1.19
  - flask-login=0.6
  - flask-wtf=1.3
  - wtforms=3.2
  - flask-cors=6.0
  - flask-caching=2.4
  - marshmallow=4.3
  - psycopg2=2.9
  - redis-py=8.1
  - python-dotenv=1.2
  - gunicorn=26.1
