# 03_fastapi — FastAPI async service (async ORM + auth + background jobs)
name: fastapi-service
channels:
  - conda-forge
dependencies:
  - python=3.13
  - fastapi=0.141
  - uvicorn-standard=0.52
  - starlette=1.6
  - pydantic=2.13
  - pydantic-settings=2.15
  - sqlalchemy=2.0
  - alembic=1.19
  - asyncpg=0.31
  - psycopg=3.3
  - httpx=0.28
  - passlib=1.7
  - python-multipart=0.0.32
  - email-validator=2.3
  - redis-py=8.1
  - celery=5.6
  - orjson=3.12
  - tenacity=9.1
  - structlog=26.1
  - gunicorn=26.1
  - pip
  - pip:
      - python-jose[cryptography]==3.5.0
