# 04_data-analysis — pandas / numpy analytics and reporting
name: data-analysis
channels:
  - conda-forge
dependencies:
  - python=3.13
  - numpy=2.5
  - pandas=3.0
  - scipy=1.18
  - polars=1.43
  - pyarrow=25.0
