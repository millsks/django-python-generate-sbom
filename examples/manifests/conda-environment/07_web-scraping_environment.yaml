# 07_web-scraping — HTTP clients, parsers, and browser automation
# After creating the env, run `playwright install` to fetch browser binaries.
name: web-scraping
channels:
  - conda-forge
dependencies:
  - python=3.13
  - requests=2.34
  - httpx=0.28
  - beautifulsoup4=4.15
  - lxml=6.1
  - parsel=1.11
  - scrapy=2.17
  - selenium=4.47
  - playwright=1.62
  - html5lib=1.1
  - tenacity=9.1
  - python-dateutil=2.9
  - urllib3=2.7
  - pip
  - pip:
      - fake-useragent==2.2.0
