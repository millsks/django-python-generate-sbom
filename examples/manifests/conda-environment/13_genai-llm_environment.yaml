# 13_genai-llm — LLM application (Claude API, retrieval, evaluation)
# The anthropic SDK moves fast; floor-pin it and let the solver take the current release.
name: genai-llm
channels:
  - conda-forge
dependencies:
  - python=3.13
  - httpx=0.28
  - pydantic=2.13
  - pydantic-settings=2.15
  - tenacity=9.1
  - tiktoken=0.14
  - sentence-transformers=6.0
  - pypdf=6.16
  - python-dotenv=1.2
  - structlog=26.1
  - pip
  - pip:
      - anthropic>=0.122.0
      - chromadb==1.5.9
