# 05_machine-learning — classical ML: modeling, tuning, tracking
# Generated manifest; run `pixi lock` to resolve against conda-forge.

[workspace]
name = "ml-classical"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[dependencies]
python = "3.12.*"
numpy = ">=2.5"
pandas = ">=2.3"
scikit-learn = ">=1.9"
xgboost = ">=3.4"
lightgbm = ">=4.7"
catboost = ">=1.2"
imbalanced-learn = ">=0.14"
optuna = ">=4.9"
shap = ">=0.52"
mlflow = ">=3.15"
joblib = ">=1.5"
matplotlib = ">=3.11"
seaborn = ">=0.13"
ipykernel = ">=7.3"

[feature.dev.dependencies]
pytest = ">=8.3"
pytest-cov = ">=6.0"
ruff = ">=0.8"
mypy = ">=1.14"
pre-commit = ">=4.0"

[feature.dev.tasks]
bootstrap = "pre-commit install --install-hooks"
fmt = "ruff format ."
lint = "ruff check ."
check = "mypy src/"
test = "pytest tests/unit/"
test-integration = "pytest tests/integration/"
cov = "pytest tests/ --cov=src --cov-report=term-missing --cov-fail-under=90"
ci = { depends-on = ["lint", "check", "cov"] }

[environments]
dev = { features = ["dev"] }
