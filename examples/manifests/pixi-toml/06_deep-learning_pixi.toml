# 06_deep-learning — PyTorch + Hugging Face training/fine-tuning
# Generated manifest; run `pixi lock` to resolve against conda-forge.

[workspace]
name = "deep-learning"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[dependencies]
python = "3.12.*"
pytorch = ">=2.12"
torchvision = ">=0.28"
torchaudio = ">=2.11"
transformers = ">=5.15"
tokenizers = ">=0.22"
datasets = ">=5.0"
accelerate = ">=1.14"
safetensors = ">=0.8"
sentencepiece = ">=0.2"
einops = ">=0.8"
tensorboard = ">=2.20"
numpy = ">=2.5"
ipykernel = ">=7.3"

[pypi-dependencies]
peft = ">=0.20.0"
evaluate = ">=0.4.6"
wandb = ">=0.28.2"

[feature.dev.dependencies]
pytest = ">=8.3"
pytest-cov = ">=6.0"
ruff = ">=0.8"
mypy = ">=1.14"
pre-commit = ">=4.0"

[feature.dev.tasks]
bootstrap = "pre-commit install --install-hooks"
fmt = "ruff format ."
lint = "ruff check ."
check = "mypy src/"
test = "pytest tests/unit/"
test-integration = "pytest tests/integration/"
cov = "pytest tests/ --cov=src --cov-report=term-missing --cov-fail-under=90"
ci = { depends-on = ["lint", "check", "cov"] }

[environments]
dev = { features = ["dev"] }
