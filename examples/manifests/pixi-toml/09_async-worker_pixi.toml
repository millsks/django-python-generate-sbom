# 09_async-worker — background job processing and scheduling
# Generated manifest; run `pixi lock` to resolve against conda-forge.

[workspace]
name = "async-worker"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[dependencies]
python = "3.13.*"
celery = ">=5.6"
kombu = ">=5.6"
billiard = ">=4.2"
redis-py = ">=8.1"
rq = ">=2.10"
apscheduler = ">=3.11"
sqlalchemy = ">=2.0"
tenacity = ">=9.1"
structlog = ">=26.1"

[pypi-dependencies]
flower = ">=2.1.0"
sentry-sdk = ">=2.68.0"

[feature.dev.dependencies]
pytest = ">=8.3"
pytest-cov = ">=6.0"
ruff = ">=0.8"
mypy = ">=1.14"
pre-commit = ">=4.0"

[feature.dev.tasks]
bootstrap = "pre-commit install --install-hooks"
fmt = "ruff format ."
lint = "ruff check ."
check = "mypy src/"
test = "pytest tests/unit/"
test-integration = "pytest tests/integration/"
cov = "pytest tests/ --cov=src --cov-report=term-missing --cov-fail-under=90"
ci = { depends-on = ["lint", "check", "cov"] }

[environments]
dev = { features = ["dev"] }
