# 11_streamlit-dashboard — interactive data app
# Generated manifest; run `pixi lock` to resolve against conda-forge.

[workspace]
name = "streamlit-dashboard"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[dependencies]
python = "3.13.*"
streamlit = ">=1.61"
pandas = ">=3.0"
numpy = ">=2.5"
plotly = ">=6.9"
altair = ">=6.2"
matplotlib = ">=3.11"
pydeck = ">=0.9"
sqlalchemy = ">=2.0"
psycopg = ">=3.3"
watchdog = ">=6.0"
python-dotenv = ">=1.2"

[feature.dev.dependencies]
pytest = ">=8.3"
pytest-cov = ">=6.0"
ruff = ">=0.8"
mypy = ">=1.14"
pre-commit = ">=4.0"

[feature.dev.tasks]
bootstrap = "pre-commit install --install-hooks"
fmt = "ruff format ."
lint = "ruff check ."
check = "mypy src/"
test = "pytest tests/unit/"
test-integration = "pytest tests/integration/"
cov = "pytest tests/ --cov=src --cov-report=term-missing --cov-fail-under=90"
ci = { depends-on = ["lint", "check", "cov"] }

[environments]
dev = { features = ["dev"] }
