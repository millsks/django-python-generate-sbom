# 12_aws-cloud — AWS SDK, Lambda, and infrastructure tooling
# Generated manifest; run `pixi lock` to resolve against conda-forge.

[workspace]
name = "aws-cloud"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[dependencies]
python = "3.13.*"
boto3 = ">=1.43"
botocore = ">=1.43"
s3fs = ">=2026.6"
moto = ">=5.2"
awscli = ">=2.36"
pydantic = ">=2.13"
structlog = ">=26.1"

[pypi-dependencies]
aws-lambda-powertools = ">=3.34.0"
aws-xray-sdk = ">=2.15.0"

[feature.dev.dependencies]
pytest = ">=8.3"
pytest-cov = ">=6.0"
ruff = ">=0.8"
mypy = ">=1.14"
pre-commit = ">=4.0"

[feature.dev.tasks]
bootstrap = "pre-commit install --install-hooks"
fmt = "ruff format ."
lint = "ruff check ."
check = "mypy src/"
test = "pytest tests/unit/"
test-integration = "pytest tests/integration/"
cov = "pytest tests/ --cov=src --cov-report=term-missing --cov-fail-under=90"
ci = { depends-on = ["lint", "check", "cov"] }

[environments]
dev = { features = ["dev"] }
