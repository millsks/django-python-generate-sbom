# 13_genai-llm — LLM application (Claude API, retrieval, evaluation)
# Generated manifest; run `pixi lock` to resolve against conda-forge.

[workspace]
name = "genai-llm"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[dependencies]
python = "3.13.*"
httpx = ">=0.28"
pydantic = ">=2.13"
pydantic-settings = ">=2.15"
tenacity = ">=9.1"
tiktoken = ">=0.14"
sentence-transformers = ">=6.0"
pypdf = ">=6.16"
python-dotenv = ">=1.2"
structlog = ">=26.1"

[pypi-dependencies]
anthropic = ">=0.122.0"
chromadb = ">=1.5.9"

[feature.dev.dependencies]
pytest = ">=8.3"
pytest-cov = ">=6.0"
ruff = ">=0.8"
mypy = ">=1.14"
pre-commit = ">=4.0"

[feature.dev.tasks]
bootstrap = "pre-commit install --install-hooks"
fmt = "ruff format ."
lint = "ruff check ."
check = "mypy src/"
test = "pytest tests/unit/"
test-integration = "pytest tests/integration/"
cov = "pytest tests/ --cov=src --cov-report=term-missing --cov-fail-under=90"
ci = { depends-on = ["lint", "check", "cov"] }

[environments]
dev = { features = ["dev"] }
