# 02_flask — Flask web application (server-rendered + forms + ORM)
# poetry: `poetry install` to install, `poetry lock` to produce poetry.lock.

[tool.poetry]
name = "flask-app"
version = "0.1.0"
description = "Flask web application (server-rendered + forms + ORM)"
authors = ["Your Name <you@example.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
Flask = "^3.1.3"
Werkzeug = "^3.1.8"
Jinja2 = "^3.1.6"
itsdangerous = "^2.2.0"
click = "^8.4.2"
Flask-SQLAlchemy = "^3.1.1"
SQLAlchemy = "^2.0.52"
Flask-Migrate = "^4.1.0"
alembic = "^1.19.1"
Flask-Login = "^0.6.3"
Flask-WTF = "^1.3.0"
WTForms = "^3.2.2"
Flask-Cors = "^6.0.5"
Flask-Caching = "^2.4.1"
marshmallow = "^4.3.1"
psycopg2-binary = "^2.9.12"
redis = "^8.1.0"
python-dotenv = "^1.2.3"
gunicorn = "^26.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-cov = "^6.0"
ruff = "^0.8"
mypy = "^1.14"
pre-commit = "^4.0"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
