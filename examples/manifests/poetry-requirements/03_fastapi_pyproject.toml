# 03_fastapi — FastAPI async service (async ORM + auth + background jobs)
# poetry: `poetry install` to install, `poetry lock` to produce poetry.lock.

[tool.poetry]
name = "fastapi-service"
version = "0.1.0"
description = "FastAPI async service (async ORM + auth + background jobs)"
authors = ["Your Name <you@example.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.141.1"
uvicorn = { version = "^0.52.3", extras = ["standard"] }
pydantic = "^2.13.4"
pydantic-settings = "^2.15.0"
starlette = "^1.6.0"
SQLAlchemy = "^2.0.52"
alembic = "^1.19.1"
asyncpg = "^0.31.0"
psycopg = { version = "^3.3.4", extras = ["binary"] }
httpx = "^0.28.1"
python-jose = { version = "^3.5.0", extras = ["cryptography"] }
passlib = { version = "^1.7.4", extras = ["bcrypt"] }
python-multipart = "^0.0.32"
email-validator = "^2.3.0"
redis = "^8.1.0"
celery = "^5.6.3"
orjson = "^3.12.0"
tenacity = "^9.1.4"
structlog = "^26.1.0"
gunicorn = "^26.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-cov = "^6.0"
ruff = "^0.8"
mypy = "^1.14"
pre-commit = "^4.0"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
