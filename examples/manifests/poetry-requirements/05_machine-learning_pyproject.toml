# 05_machine-learning — classical ML: modeling, tuning, tracking
# poetry: `poetry install` to install, `poetry lock` to produce poetry.lock.

[tool.poetry]
name = "ml-classical"
version = "0.1.0"
description = "classical ML: modeling, tuning, tracking"
authors = ["Your Name <you@example.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
numpy = "^2.5.2"
pandas = "^2.3.3"
scikit-learn = "^1.9.0"
xgboost = "^3.4.1"
lightgbm = "^4.7.0"
catboost = "^1.2.10"
imbalanced-learn = "^0.14.2"
optuna = "^4.9.0"
shap = "^0.52.0"
mlflow = "^3.15.1"
joblib = "^1.5.3"
matplotlib = "^3.11.1"
seaborn = "^0.13.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-cov = "^6.0"
ruff = "^0.8"
mypy = "^1.14"
pre-commit = "^4.0"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
