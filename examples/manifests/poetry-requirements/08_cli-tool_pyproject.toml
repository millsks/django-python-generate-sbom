# 08_cli-tool — command line application
# poetry: `poetry install` to install, `poetry lock` to produce poetry.lock.

[tool.poetry]
name = "cli-tool"
version = "0.1.0"
description = "command line application"
authors = ["Your Name <you@example.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
typer = "^0.27.1"
click = "^8.4.2"
rich = "^15.0.0"
questionary = "^2.1.1"
platformdirs = "^4.11.3"
PyYAML = "^6.0.3"
tomlkit = "^0.15.1"
pydantic = "^2.13.4"
structlog = "^26.1.0"
tqdm = "^4.70.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-cov = "^6.0"
ruff = "^0.8"
mypy = "^1.14"
pre-commit = "^4.0"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
