# 10_dev-tooling — test, lint, type-check, and release tooling (dev only)
# poetry: `poetry install` to install, `poetry lock` to produce poetry.lock.

[tool.poetry]
name = "dev-tooling"
version = "0.1.0"
description = "test, lint, type-check, and release tooling (dev only)"
authors = ["Your Name <you@example.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
pytest = "^9.1.1"
pytest-cov = "^7.1.0"
pytest-asyncio = "^1.4.0"
pytest-mock = "^3.15.1"
pytest-xdist = "^3.8.0"
coverage = "^7.15.4"
hypothesis = "^6.165.10"
respx = "^0.23.1"
responses = "^0.26.2"
faker = "^40.36.0"
freezegun = "^1.5.5"
ruff = "^0.16.3"
mypy = "^2.3.1"
pre-commit = "^4.6.2"
tox = "^4.60.0"
build = "^1.5.0"
twine = "^7.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-cov = "^6.0"
ruff = "^0.8"
mypy = "^1.14"
pre-commit = "^4.0"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
