# 11_streamlit-dashboard — interactive data app
# poetry: `poetry install` to install, `poetry lock` to produce poetry.lock.

[tool.poetry]
name = "streamlit-dashboard"
version = "0.1.0"
description = "interactive data app"
authors = ["Your Name <you@example.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
streamlit = "^1.61.1"
pandas = "^3.0.5"
numpy = "^2.5.2"
plotly = "^6.9.0"
altair = "^6.2.2"
matplotlib = "^3.11.1"
pydeck = "^0.9.3"
SQLAlchemy = "^2.0.52"
psycopg = { version = "^3.3.4", extras = ["binary"] }
watchdog = "^6.0.0"
python-dotenv = "^1.2.3"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-cov = "^6.0"
ruff = "^0.8"
mypy = "^1.14"
pre-commit = "^4.0"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
