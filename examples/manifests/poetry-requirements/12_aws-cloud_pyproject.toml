# 12_aws-cloud — AWS SDK, Lambda, and infrastructure tooling
# poetry: `poetry install` to install, `poetry lock` to produce poetry.lock.

[tool.poetry]
name = "aws-cloud"
version = "0.1.0"
description = "AWS SDK, Lambda, and infrastructure tooling"
authors = ["Your Name <you@example.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
boto3 = "^1.43.73"
botocore = "^1.43.73"
aws-lambda-powertools = "^3.34.0"
aws-xray-sdk = "^2.15.0"
s3fs = "^0.4.2"
moto = "^5.2.2"
awscli = "^1.46.0"
pydantic = "^2.13.4"
structlog = "^26.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-cov = "^6.0"
ruff = "^0.8"
mypy = "^1.14"
pre-commit = "^4.0"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
