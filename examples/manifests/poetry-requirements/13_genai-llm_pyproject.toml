# 13_genai-llm — LLM application (Claude API, retrieval, evaluation)
# poetry: `poetry install` to install, `poetry lock` to produce poetry.lock.

[tool.poetry]
name = "genai-llm"
version = "0.1.0"
description = "LLM application (Claude API, retrieval, evaluation)"
authors = ["Your Name <you@example.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
anthropic = ">=0.122.0"
httpx = "^0.28.1"
pydantic = "^2.13.4"
pydantic-settings = "^2.15.0"
tenacity = "^9.1.4"
tiktoken = "^0.14.0"
chromadb = "^1.5.9"
sentence-transformers = "^6.0.0"
pypdf = "^6.16.1"
python-dotenv = "^1.2.3"
structlog = "^26.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-cov = "^6.0"
ruff = "^0.8"
mypy = "^1.14"
pre-commit = "^4.0"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
