# 03_fastapi — FastAPI async service (async ORM + auth + background jobs)
# uv: `uv sync` to install, `uv lock` to produce uv.lock.

[project]
name = "fastapi-service"
version = "0.1.0"
description = "FastAPI async service (async ORM + auth + background jobs)"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.3",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "starlette==1.6.0",
    "SQLAlchemy==2.0.52",
    "alembic==1.19.1",
    "asyncpg==0.31.0",
    "psycopg[binary]==3.3.4",
    "httpx==0.28.1",
    "python-jose[cryptography]==3.5.0",
    "passlib[bcrypt]==1.7.4",
    "python-multipart==0.0.32",
    "email-validator==2.3.0",
    "redis==8.1.0",
    "celery==5.6.3",
    "orjson==3.12.0",
    "tenacity==9.1.4",
    "structlog==26.1.0",
    "gunicorn==26.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.14",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
