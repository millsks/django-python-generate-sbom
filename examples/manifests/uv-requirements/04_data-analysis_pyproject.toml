# 04_data-analysis — pandas / numpy analytics and reporting
# uv: `uv sync` to install, `uv lock` to produce uv.lock.

[project]
name = "data-analysis"
version = "0.1.0"
description = "pandas / numpy analytics and reporting"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.5.2",
    "pandas==3.0.5",
    "scipy==1.18.0",
    "polars==1.43.2",
    "pyarrow==25.0.1",
    "duckdb==1.5.5",
    "matplotlib==3.11.1",
    "seaborn==0.13.2",
    "statsmodels==0.14.6",
    "openpyxl==3.1.5",
    "xlsxwriter==3.2.9",
    "tabulate==0.10.0",
    "tqdm==4.70.0",
    "python-dateutil==2.9.0.post0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.14",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
