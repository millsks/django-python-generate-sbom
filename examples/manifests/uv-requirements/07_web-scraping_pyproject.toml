# 07_web-scraping — HTTP clients, parsers, and browser automation
# uv: `uv sync` to install, `uv lock` to produce uv.lock.

[project]
name = "web-scraping"
version = "0.1.0"
description = "HTTP clients, parsers, and browser automation"
requires-python = ">=3.12"
dependencies = [
    "requests==2.34.2",
    "httpx==0.28.1",
    "beautifulsoup4==4.15.0",
    "lxml==6.1.1",
    "parsel==1.11.0",
    "Scrapy==2.17.0",
    "selenium==4.47.0",
    "playwright==1.62.0",
    "html5lib==1.1",
    "tenacity==9.1.4",
    "python-dateutil==2.9.0.post0",
    "urllib3==2.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.14",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
