# 08_cli-tool — command line application
# uv: `uv sync` to install, `uv lock` to produce uv.lock.

[project]
name = "cli-tool"
version = "0.1.0"
description = "command line application"
requires-python = ">=3.12"
dependencies = [
    "typer==0.27.1",
    "click==8.4.2",
    "rich==15.0.0",
    "questionary==2.1.1",
    "platformdirs==4.11.3",
    "PyYAML==6.0.3",
    "tomlkit==0.15.1",
    "pydantic==2.13.4",
    "structlog==26.1.0",
    "tqdm==4.70.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.14",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
