# 11_streamlit-dashboard — interactive data app
# uv: `uv sync` to install, `uv lock` to produce uv.lock.

[project]
name = "streamlit-dashboard"
version = "0.1.0"
description = "interactive data app"
requires-python = ">=3.12"
dependencies = [
    "streamlit==1.61.1",
    "pandas==3.0.5",
    "numpy==2.5.2",
    "plotly==6.9.0",
    "altair==6.2.2",
    "matplotlib==3.11.1",
    "pydeck==0.9.3",
    "SQLAlchemy==2.0.52",
    "psycopg[binary]==3.3.4",
    "watchdog==6.0.0",
    "python-dotenv==1.2.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.14",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
