# 12_aws-cloud — AWS SDK, Lambda, and infrastructure tooling
# uv: `uv sync` to install, `uv lock` to produce uv.lock.

[project]
name = "aws-cloud"
version = "0.1.0"
description = "AWS SDK, Lambda, and infrastructure tooling"
requires-python = ">=3.12"
dependencies = [
    "boto3==1.43.73",
    "botocore==1.43.73",
    "aws-lambda-powertools==3.34.0",
    "aws-xray-sdk==2.15.0",
    "s3fs==0.4.2",
    "moto==5.2.2",
    "awscli==1.46.0",
    "pydantic==2.13.4",
    "structlog==26.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.14",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
