# Umbrella pixi manifest for the whole project (AD-13).
# One environment, one runner: pixi installs the Python env and orchestrates every
# task. Story 21.1 moved the Django tree to a src/ layout at the repo root, so tasks
# run from the root with NO `cwd`. Story 21.19 retired the React SPA and with it the
# Node runtime and the eight `fe-*` tasks — the project is Python-only.
[workspace]
authors = ["Kevin Mills <millsks@gmail.com>"]
channels = ["conda-forge"]
name = "python-inventory-supply-lens"
platforms = ["osx-arm64", "linux-64", "linux-aarch64", "win-64"]
version = "0.1.0"

# Version floors relaxed to what conda-forge actually serves today; the
# ARCHITECTURE-SPINE pins (Django 6.0.6, DRF 3.17.1, Celery 5.6.3, etc.) are
# aspirational future versions. Resolved versions are captured in pixi.lock and
# will be tightened toward the spine pins as those land on conda-forge.
[dependencies]
python = "3.13.*"
django = ">=5.1"
djangorestframework = ">=3.15"
djangorestframework-api-key = ">=3.1"
celery = ">=5.3"
# Celery result backend for the containerless local dev path (Story 20.4): the `django-db`
# backend persists task results in the local SQLite DB so local dev needs no Redis. The
# container/prod path keeps the Redis result backend. Cross-platform (incl. win-64).
django-celery-results = ">=2.5"
redis-py = ">=5"
structlog = ">=24"
django-environ = ">=0.11"
django-storages = ">=1.14"
boto3 = ">=1.34"
psycopg = ">=3.1"
whitenoise = ">=6.6"
curl = ">=8"
uv = ">=0.11.26,<0.12"
cyclonedx-python-lib = ">=11.11,<12"
lib4sbom = ">=0.10.4,<0.11"
requests = ">=2.32,<3"
requests-cache = ">=1.2,<2"
requests-ratelimiter = ">=0.7,<1"
tenacity = ">=9,<10"
drf-spectacular = ">=0.27"
drf-spectacular-sidecar = ">=2026.7.1,<2027"
django-crispy-forms = ">=2.6,<3"
crispy-bootstrap5 = ">=2026.3,<2027"
django-tables2 = ">=3.0.0,<4"
django-filter = ">=26.1,<27"
openpyxl = ">=3.1.5,<4"

# --- Unix-only dependency scoping (Story 20.2) ---
# gunicorn is the Unix-only WSGI server; it has no win-64 conda build. It runs
# only in the Linux container / prod image via the `web` task; Windows local dev
# uses `runserver` (Story 20.5). Scope it to the non-Windows platforms so the
# win-64 solve resolves while linux/osx keep it identically.
[target.linux-64.dependencies]
gunicorn = ">=22"

[target.linux-aarch64.dependencies]
gunicorn = ">=22"

[target.osx-arm64.dependencies]
gunicorn = ">=22"

# --- Per-OS worker pool override (Story 20.5) ---
# Celery's prefork pool is Unix-only. On Windows the local `worker` task must run
# with `--pool=solo` (single-threaded, reliable for local dev); linux/osx keep the
# base prefork `-c 4`. This target table replaces the base `worker` task on win-64
# only — same queues, same local settings — so honcho/`pixi run worker` are correct
# per platform without any shared shell command.
[target.win-64.tasks.worker]
cmd = "celery -A config.celery_app worker -Q pipeline,analysis --pool=solo"
env = { DJANGO_SETTINGS_MODULE = "config.settings.local" }

# Windows-only, and REQUIRED for the containerless worker to start at all (Story 22.7).
#
# Kombu's filesystem:// transport — the local broker (Story 20.4) — locks its message files
# with LockFileEx on Windows, so `kombu/transport/filesystem.py` does an unconditional
# `import pywintypes / win32con / win32file` at module import under `os.name == "nt"`. Its own
# comment reads "needs win32all to work on Windows". Without pywin32 the import raises
# ModuleNotFoundError and `pixi run worker`, `pixi run beat`, and therefore `pixi run dev` all
# die at startup — on the one platform with no Docker fallback.
#
# This was broken from the moment Epic 20 shipped the containerless path. Nothing caught it
# because the Windows CI job ran unit tests only, and those use eager Celery, which never loads
# the transport. Story 22.3 widened that job and Story 22.4 added a real-worker test; it failed
# on the first Windows run.
#
# Scoped to win-64 so macOS and Linux environments are untouched.
[target.win-64.dependencies]
pywin32 = ">=306"

[pypi-dependencies]
python-inventory-supply-lens = { path = ".", editable = true }

[feature.dev.dependencies]
pytest = ">=8,<9"
pytest-cov = ">=6,<8"
pytest-django = ">=4.9,<5"
mypy = ">=1.13,<2"
ruff = ">=0.14,<0.16"
pre-commit = ">=4,<5"
django-stubs = ">=5.1,<6"
djangorestframework-stubs = ">=3.15,<4"
git-cliff = ">=2,<3"
python-build = ">=1.2,<2"
hatchling = ">=1.25,<2"
responses = ">=0.25,<1"
bandit = ">=1.7,<2"
flower = ">=2,<3"
# Pure-Python, cross-platform Procfile process manager (Story 20.5). Runs the
# local web+worker+beat trio via `pixi run dev` (honcho start) on macOS AND
# Windows — unlike foreman, it needs no Ruby and resolves on win-64. Pinned to
# 2.x: 1.x imports the removed `pkg_resources` and breaks under setuptools >=81.
honcho = ">=2,<3"
mkdocs-material = ">=9.5,<10"
mkdocstrings-python = ">=1.11,<2"

[environments]
default = { features = ["dev"], solve-group = "default" }

# --- Quality tasks — run from the repo root (Story 21.1) ---
# There is no "backend" qualifier any more: Story 21.19 retired the SPA, so these are
# simply the project's tasks.
[tasks.fmt]
cmd = "ruff format ."

[tasks.lint]
cmd = "ruff check ."

[tasks.check]
cmd = "mypy src"

[tasks.test]
cmd = "pytest tests/unit/"

[tasks.test-integration]
cmd = "pytest tests/integration/"

[tasks.cov]
cmd = "pytest tests/ --cov=src --cov-report=term-missing --cov-fail-under=90"

[tasks.build]
cmd = "python -m build --no-isolation --wheel"

# Non-mutating format check (companion to the mutating `fmt`) — CI-friendly.
[tasks.fmt-check]
cmd = "ruff format --check ."

# Lint with autofix (companion to the read-only `lint`).
[tasks.lint-fix]
cmd = "ruff check --fix ."

# Static security scan (bandit); reads [tool.bandit] from pyproject, medium+ severity
# only so low-noise asserts don't fail it.
[tasks.security]
cmd = "bandit -r src -c pyproject.toml -ll"

# Full suite with an HTML coverage report for local inspection (htmlcov/).
[tasks.cov-html]
cmd = "pytest tests/ --cov=src --cov-report=html"

# CI coverage: same gate as `cov` plus branch coverage and a machine-readable
# coverage.xml (at the repo root) for the Codecov upload (Story 9.1).
[tasks.cov-xml]
cmd = "pytest tests/ --cov=src --cov-branch --cov-report=xml --cov-report=term-missing --cov-fail-under=90"

# --- Server / ops tasks — also the Docker service commands ---
# Applies migrations, including the two data migrations that seed the ADMIN org and the
# default org an anonymous caller acts as. `pixi run migrate` is the only setup the app
# needs before `pixi run dev`.
[tasks.migrate]
cmd = "python manage.py migrate"

# Creates a Django superuser for the ADMIN org from DJANGO_SUPERUSER_EMAIL /
# DJANGO_SUPERUSER_PASSWORD (Story 2.13); idempotent. Since Story 21.24 the app itself
# needs NO account — this is only for `django.contrib.admin` at /admin/.
[tasks.seed-superuser]
cmd = "python manage.py seed_superuser"

[tasks.collectstatic]
cmd = "python manage.py collectstatic --noinput"

# Container/prod WSGI server (Unix-only). Used by the Dockerfile/OCP `web`
# process; NEVER on the local/dev path — local uses `runserver` (see below).
[tasks.web]
cmd = "gunicorn config.wsgi --bind 0.0.0.0:8000 --workers 4"

# --- Cross-platform local dev tasks (Story 20.5) — macOS + Windows, no containers ---
# Local web = Django's `runserver` (cross-platform; gunicorn is Unix-only). Serves
# on :8000 under local settings. Standalone (`pixi run runserver`) or via honcho.
[tasks.runserver]
cmd = "python manage.py runserver 0.0.0.0:8000"
env = { DJANGO_SETTINGS_MODULE = "config.settings.local" }

# Local combined Celery worker draining BOTH queues in one process (prefork `-c 4`,
# Unix-only pool). Production keeps the two dedicated worker-pipeline/worker-analysis
# tasks. On win-64 the `[target.win-64.tasks.worker]` override swaps to `--pool=solo`.
[tasks.worker]
cmd = "celery -A config.celery_app worker -Q pipeline,analysis -c 4"
env = { DJANGO_SETTINGS_MODULE = "config.settings.local" }

# Worker pool per OS (Story 20.4): the default (prefork) pool below is Unix-only. On
# Windows (win-64) the local worker must instead use `--pool=solo` (or `--pool=threads`)
# because prefork is not supported there. Story 20.5 wires the per-platform `[target.*]`
# task overrides that inject `--pool=solo` on win-64 while linux/osx keep prefork `-c 4`.
[tasks.worker-pipeline]
cmd = "celery -A config.celery_app worker -Q pipeline -c 4"

[tasks.worker-analysis]
cmd = "celery -A config.celery_app worker -Q analysis -c 4"

# Portable beat schedule (Story 20.4): the schedule DB lives at a repo-relative,
# git-ignored path (.celery/celerybeat-schedule) — not POSIX-only `/tmp`, which does
# not exist on Windows. Tasks run from the repo root, so this resolves under ./.celery/.
[tasks.beat]
cmd = "celery -A config.celery_app beat -s .celery/celerybeat-schedule"

# Celery Flower monitoring UI (http://localhost:5555).
[tasks.flower]
cmd = "celery -A config.celery_app flower --port=5555"

# --- Project-wide tasks — run from the root ---
# One-command containerless local stack (Story 20.5): honcho reads the root
# Procfile and launches THREE processes — web (runserver) + worker + beat — together in
# the foreground, identically on macOS and Windows. Sets local settings for the whole
# process tree so no child falls back to the production-defaulting wsgi.
#
# The UI is at http://localhost:8000, served by Django itself: Story 21.19 removed the
# fourth (Vite) process, so there is no second port and no build step.
# First run needs `pixi run migrate`, which seeds the orgs the app needs.
[tasks.dev]
cmd = "honcho start"
env = { DJANGO_SETTINGS_MODULE = "config.settings.local" }

[tasks.bootstrap]
cmd = "pre-commit install --install-hooks --hook-type commit-msg --hook-type pre-commit"

[tasks.changelog]
cmd = "git cliff -o CHANGELOG.md"

[tasks.precommit]
cmd = "pre-commit run --all-files"

[tasks.act]
cmd = "act --container-architecture linux/amd64"

# Refresh pinned pre-commit hook revisions (bootstrap already installs the
# commit-msg + pre-commit hooks; this keeps their versions current).
[tasks.hooks-update]
cmd = "pre-commit autoupdate"

# Prepend only the unreleased commits to CHANGELOG.md (companion to the full `changelog`).
[tasks.changelog-unreleased]
cmd = "git cliff --unreleased --prepend CHANGELOG.md"

# --- Documentation site (MkDocs Material → GitHub Pages; Story 11.1) ---
# Live-reload preview at http://localhost:8000.
[tasks.docs-serve]
cmd = "mkdocs serve"

# Strict build (broken links/nav fail); outputs the static site to ./site.
[tasks.docs-build]
cmd = "mkdocs build --strict"

# --- Docker Compose convenience wrappers (compose file at repo root) ---
[tasks.docker-build]
cmd = "docker compose build"

[tasks.docker-up]
cmd = "docker compose up -d"

[tasks.docker-down]
cmd = "docker compose down"

[tasks.docker-down-v]
cmd = "docker compose down -v"

[tasks.docker-logs]
cmd = "docker compose logs -f"

[tasks.docker-ps]
cmd = "docker compose ps"

[tasks.docker-migrate]
cmd = "docker compose exec web pixi run migrate"

[tasks.docker-shell]
cmd = "docker compose exec web bash"

# The CI gate (AD-13 pixi umbrella). Mirrors the GitHub CI quality jobs: ruff lint +
# format-check, mypy, bandit, full coverage, the wheel build, and the docs build.
# Story 9.1 wired the format-check / security / typecheck gates in so local == CI;
# Story 21.19 removed the frontend half when the SPA was retired.
[tasks.ci]
depends-on = [
  "precommit",
  "build",
  "check",
  "lint",
  "fmt-check",
  "security",
  "cov",
  "docs-build",
]
