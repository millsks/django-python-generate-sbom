# SonarCloud configuration for django-python-generate-sbom
# https://docs.sonarcloud.io/advanced-setup/analysis-parameters/
#
# Operator prerequisites (Story 9.2): a SonarCloud project bound to this repo
# and a SONAR_TOKEN repository secret. Confirm the exact projectKey/organization
# when the SonarCloud project is created — the values below follow SonarCloud's
# default `<org>_<repo>` convention.

# Project identification — LAYER L5, DELIBERATELY NOT RENAMED (Story 21.22 AC #5).
#
# The product was renamed to "Python Inventory Supply Lens" (Story 21.21) and the
# distribution to `python-inventory-supply-lens` (Story 21.22). These three values were
# left alone on purpose, by product-owner decision:
#
#   * A SonarCloud `projectKey` cannot be renamed. Creating a new project discards every
#     historical analysis, the new-code baseline, and the issue triage history on it.
#   * The GitHub repository name and the published docs-site URL are unchanged for the
#     same reason in kind — renaming them breaks every existing link and badge.
#
# `.vscode/settings.json` binds SonarLint to this same key and is unchanged for the same
# reason; changing one without the other silently disconnects the IDE integration.
#
# Please do not "fix" the mismatch between these values and the product name.
sonar.projectKey=millsks_django-python-generate-sbom
sonar.organization=millsks

# SonarCloud host (required by the sonarqube-scan-action for the cloud service)
sonar.host.url=https://sonarcloud.io

# Project metadata — projectName tracks projectKey (L5), NOT the product name. See above.
sonar.projectName=django-python-generate-sbom
sonar.projectVersion=0.1.0

# Source code settings (Django/DRF/Celery — Python only since Story 21.19)
sonar.sources=src
sonar.tests=tests

# Python-specific settings (pixi pins the 3.13 interpreter)
sonar.python.version=3.13

# Coverage settings (report produced in-job by `pixi run cov-xml`)
sonar.python.coverage.reportPaths=coverage.xml
sonar.coverage.exclusions=tests/**

# Test settings
sonar.test.inclusions=tests/**

# Exclude files from analysis
sonar.exclusions=\
  **/__pycache__/**,\
  **/*.egg-info/**,\
  **/migrations/**,\
  .pixi/**,\
  .pytest_cache/**,\
  _bmad-output/**,\
  _bmad/**,\
  .agents/**,\
  .claude/**,\
  docker/**

# Language-specific source encoding
sonar.sourceEncoding=UTF-8
